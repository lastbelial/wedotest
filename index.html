function render(){let x=bank[idx];progText.textContent=`${t().q} ${idx+1} ${t().of} ${bank.length} · ${t().answered}: ${ans.filter(v=>v!==null).length}`;bar.style.width=`${(idx+1)/bank.length*100}%`;question.textContent=x[lang].q;answers.innerHTML='';if(x.img){imgbox.classList.remove('hidden');qimg.style.display='inline-block';imgfail.textContent='';qimg.src=x.img;qimg.onerror=()=>{qimg.style.display='none';imgfail.textContent=t().imgfail}}else imgbox.classList.add('hidden');x[lang].a.forEach((a,i)=>{let b=document.createElement('button');b.className='answer'+(ans[idx]===i?' sel':'');b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>{ans[idx]=i;render()};answers.appendChild(b)});prev.textContent=t().back;next.textContent=idx===bank.length-1?t().finish:t().next;prev.disabled=idx===0;next.disabled=ans[idx]===null}
function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');renderResult()}
function renderResult(){let c=bank.reduce((n,x,i)=>n+(ans[i]===x.correct),0),p=Math.round(c/bank.length*100);score.textContent=`${c}/${bank.length}`;grade.textContent=p>=90?t().excellent:p>=75?t().good:p>=60?t().mid:t().low;errors.innerHTML='';bank.forEach((x,i)=>{if(ans[i]!==x.correct){let d=document.createElement('div');d.className='err';d.innerHTML=`<b>${i+1}. ${x[lang].q}</b><div class="bad">${t().your}: ${ans[i]===null?'—':x[lang].a[ans[i]]}</div><div class="good">${t().right}: ${x[lang].a[x.correct]}</div><div>${x[lang].e}</div>`;errors.appendChild(d)}});retry.textContent=t().retry;homeBtn.textContent=t().home;printBtn.textContent=t().print}
ruB.onclick=()=>setLang('ru');kzB.onclick=()=>setLang('kz');stBtn.onclick=()=>start('student');teBtn.onclick=()=>start('teacher');prev.onclick=()=>{if(idx>0){idx--;render()}};next.onclick=()=>{if(ans[idx]===null)return;if(idx<bank.length-1){idx++;render()}else finish()};retry.onclick=()=>start(mode);homeBtn.onclick=()=>{quiz.classList.add('hidden');result.classList.add('hidden');home.classList.remove('hidden')};printBtn.onclick=()=>window.print();setLang('ru');
</script></body></html>
